syntax = "proto3";

package sail.driver;

message RegisterWorkerRequest {
  uint64 driver_id = 1;
  uint64 worker_id = 2;
  string host = 3;
  uint32 port = 4;
}

message RegisterWorkerResponse {
}

message ReportWorkerHeartbeatRequest {
  uint64 driver_id = 1;
  uint64 worker_id = 2;
}

message ReportWorkerHeartbeatResponse {
}

message ReportWorkerKnownPeersRequest {
  uint64 driver_id = 1;
  uint64 worker_id = 2;
  repeated uint64 peer_worker_ids = 3;
}

message ReportWorkerKnownPeersResponse {
}

message ReportTaskStatusRequest {
  uint64 driver_id = 1;
  uint64 job_id = 2;
  uint64 stage = 3;
  uint64 partition = 4;
  uint64 attempt = 5;
  TaskStatus status = 6;
  // An optional explanation of the task status.
  optional string message = 7;
  // An optional JSON string that contains the cause of the task failure.
  optional string cause = 8;
  // Committed output statistics, sent only with a SUCCEEDED status after the
  // shuffle sink committed the output.
  optional TaskOutputStatistics output_statistics = 9;
  uint64 sequence = 101;
}

// Committed shuffle output statistics of one task attempt.
// Totals are exact, while per-channel sizes use a compact encoding.
message TaskOutputStatistics {
  // Rows accepted by the sink.
  uint64 rows = 1;
  // Uncompressed Arrow bytes the accepted batches reference.
  uint64 logical_bytes = 2;
  // Bytes the backend stores after its own compression.
  // Absent when the backend cannot tell.
  optional uint64 physical_bytes = 3;
  ChannelSizes channel_logical_bytes = 4;
  // Absent when the backend cannot tell.
  optional ChannelSizes channel_physical_bytes = 5;
}

// Approximate per-channel sizes. A size is encoded as a 16-bit code: 0 for an
// empty channel, otherwise 1 + ceil(log_1.01(size)), so that a decoded size is
// within 1% of the true size.
message ChannelSizes {
  oneof kind {
    DenseChannelSizes dense = 1;
    SparseChannelSizes sparse = 2;
  }
}

message DenseChannelSizes {
  // One little-endian 16-bit code per channel.
  bytes codes = 1;
}

// Sizes of many channels: which channels are empty, the channels much larger than
// the average with their own codes, and one average size for the other channels.
message SparseChannelSizes {
  uint64 channels = 1;
  // A bitmap of the nonempty channels, least significant bit first.
  bytes nonempty = 2;
  uint64 average = 3;
  // The channels with their own codes, in ascending order.
  repeated uint32 huge_channels = 4;
  // One little-endian 16-bit code per entry of `huge_channels`.
  bytes huge_codes = 5;
}

enum TaskStatus {
  TASK_STATUS_RUNNING = 0;
  TASK_STATUS_SUCCEEDED = 1;
  TASK_STATUS_FAILED = 2;
  TASK_STATUS_CANCELED = 3;
}

message ReportTaskStatusResponse {
}

message ReportMetricsRequest {
  uint64 driver_id = 1;
  // Each entry is an encoded opentelemetry.proto.metrics.v1.ResourceMetrics message.
  repeated bytes metrics = 2;
}

message ReportMetricsResponse {
}

service DriverService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse) {}
  rpc ReportWorkerHeartbeat(ReportWorkerHeartbeatRequest) returns (ReportWorkerHeartbeatResponse) {}
  // Report the peers known to the worker so that the driver does not need to
  // send the peer information to the worker again when running tasks in the future.
  rpc ReportWorkerKnownPeers(ReportWorkerKnownPeersRequest) returns (ReportWorkerKnownPeersResponse) {}
  rpc ReportTaskStatus(ReportTaskStatusRequest) returns (ReportTaskStatusResponse) {}
  rpc ReportMetrics(ReportMetricsRequest) returns (ReportMetricsResponse) {}
}
